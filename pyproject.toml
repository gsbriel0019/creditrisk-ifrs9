[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk-ifrs9"
version = "1.0.0"
description = "Enterprise Credit Risk Modeling, Scorecard Engineering, Survival Lifetime PD & IFRS 9 Expected Credit Loss (ECL) Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gabriel Proaño", email = "gabriel.proano@example.com"}
]
keywords = [
    "credit-risk",
    "ifrs-9",
    "ecl",
    "probability-of-default",
    "scorecard",
    "weight-of-evidence",
    "survival-analysis",
    "machine-learning",
    "fintech",
    "banking"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "lightgbm>=3.3.5",
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*"]
